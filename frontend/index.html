<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yodeck Instant Ad Overlay</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: transparent !important;
        overflow: hidden;
        pointer-events: none;
      }

      #ad-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        background: #000000;
        z-index: 9999;
        pointer-events: auto;
      }

      #ad-player {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="ad-container">
      <video id="ad-player" playsinline autoplay muted></video>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const screenId =
        urlParams.get("screen_id") || "b8c714a1-33c0-49dd-bfc5-bec7153c8c81";
      const BACKEND_URL =
        "https://73f1-2401-4900-1c62-41d0-f6a4-565b-4a2b-98e0.ngrok-free.app";

      function playAdVideo(videoUrl) {
        const adContainer = document.getElementById("ad-container");
        const adPlayer = document.getElementById("ad-player");

        console.log("Playing instant ad:", videoUrl);

        // Force container visible with a bright red background for testing
        adContainer.style.background = "#ff0000";
        adContainer.style.display = "block";

        adPlayer.muted = true;
        adPlayer.src = videoUrl;

        const playPromise = adPlayer.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              adPlayer.muted = false;
            })
            .catch((err) => {
              console.error("Autoplay blocked:", err);
            });
        }

        adPlayer.onerror = (e) => {
          console.error("Video element error on Tizen:", e);
        };

        adPlayer.onended = () => {
          adPlayer.pause();
          adPlayer.src = "";
          adContainer.style.display = "none";
        };
      }

      // Poll backend every 2 seconds
      setInterval(async () => {
        try {
          const res = await fetch(
            `${BACKEND_URL}/api/v1/screens/${screenId}/check-status`,
            {
              headers: { "ngrok-skip-browser-warning": "1" },
              cache: "no-store",
            },
          );
          const data = await res.json();

          if (data.shouldPlayAd && data.url) {
            playAdVideo(data.url);
          }
        } catch (error) {
          console.warn("Polling request failed:", error.message);
        }
      }, 2000);
    </script>
  </body>
</html>
